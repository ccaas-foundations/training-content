<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 230">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axis -->
  <text font-family="Arial, sans-serif" font-size="12" fill="#888780" x="62" y="28">Less autonomous</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#888780" x="618" y="28" text-anchor="end">More autonomous</text>
  <line x1="62" y1="20" x2="618" y2="20" stroke="#B4B2A9" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- Level 1: Autocomplete -->
  <rect x="40" y="40" width="142" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441" x="111" y="68" text-anchor="middle">Autocomplete</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="111" y="88" text-anchor="middle">Predicts next tokens</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="111" y="103" text-anchor="middle">Tab to accept</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="111" y="118" text-anchor="middle">No file access</text>

  <!-- Level 2: Conversational -->
  <rect x="196" y="40" width="142" height="100" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441" x="267" y="68" text-anchor="middle">Chat / explain</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="267" y="88" text-anchor="middle">Describe, get code</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="267" y="103" text-anchor="middle">You copy-paste</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#5F5E5A" x="267" y="118" text-anchor="middle">No file access</text>

  <!-- Level 3: In-editor chat -->
  <rect x="352" y="40" width="142" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#3C3489" x="423" y="68" text-anchor="middle">In-editor chat</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="423" y="88" text-anchor="middle">Reads your files</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="423" y="103" text-anchor="middle">Shows diffs</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="423" y="118" text-anchor="middle">Human-gated</text>

  <!-- Agentic line -->
  <line x1="500" y1="34" x2="500" y2="148" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#993C1D" x="500" y="162" text-anchor="middle">agentic line</text>

  <!-- Level 4: Agentic CLI -->
  <rect x="508" y="40" width="142" height="100" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#712B13" x="579" y="68" text-anchor="middle">Agentic CLI</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="579" y="88" text-anchor="middle">Reads + writes files</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="579" y="103" text-anchor="middle">Runs commands</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="579" y="118" text-anchor="middle">Acts autonomously</text>

  <!-- Bottom labels -->
  <text font-family="Arial, sans-serif" font-size="11" fill="#888780" x="246" y="190" text-anchor="middle">Human applies every change</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="579" y="190" text-anchor="middle">Agent acts; human reviews outcomes</text>

  <!-- Tool examples -->
  <text font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9" x="111" y="210" text-anchor="middle">Windsurf, Copilot</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9" x="267" y="210" text-anchor="middle">Claude.ai, ChatGPT</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#B4B2A9" x="423" y="210" text-anchor="middle">Cascade, Cursor</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="579" y="210" text-anchor="middle">Claude Code, Codex CLI</text>
</svg>
