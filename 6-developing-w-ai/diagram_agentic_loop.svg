<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 380">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Autonomous zone: x=110 y=40 w=440 h=300 -->
  <rect x="110" y="40" width="440" height="300" rx="16" fill="none" stroke="#993C1D" stroke-width="1" stroke-dasharray="6 4"/>
  <text font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#993C1D" x="330" y="32" text-anchor="middle">Autonomous zone</text>

  <!-- Plan (left, center y=190) -->
  <rect x="126" y="162" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#3C3489" x="186" y="185" text-anchor="middle">Plan</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="186" y="203" text-anchor="middle">Decide next action</text>

  <!-- Perceive (top, center x=330) -->
  <rect x="270" y="56" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#3C3489" x="330" y="79" text-anchor="middle">Perceive</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="330" y="97" text-anchor="middle">Read files, errors</text>

  <!-- Act (right, center y=190) -->
  <rect x="414" y="162" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#712B13" x="474" y="185" text-anchor="middle">Act</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="474" y="203" text-anchor="middle">Write files, run cmds</text>

  <!-- Observe (bottom, center x=330) -->
  <rect x="270" y="268" width="120" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#3C3489" x="330" y="291" text-anchor="middle">Observe</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#534AB7" x="330" y="309" text-anchor="middle">Test results, diffs</text>

  <!-- Clockwise: Plan -> Perceive -> Act -> Observe -> Plan -->
  <path d="M186 162 L186 84 L270 84" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M390 84 L474 84 L474 162" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M474 218 L474 296 L390 296" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M270 296 L186 296 L186 218" fill="none" stroke="#7F77DD" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Task (left of box) -->
  <rect x="20" y="172" width="68" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041" x="54" y="195" text-anchor="middle">Task</text>
  <line x1="88" y1="190" x2="126" y2="190" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#888780" x="54" y="222" text-anchor="middle">You give a goal</text>

  <!-- Result (right of box) -->
  <line x1="534" y1="190" x2="572" y2="190" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="572" y="172" width="80" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#085041" x="612" y="195" text-anchor="middle">Result</text>
  <text font-family="Arial, sans-serif" font-size="11" fill="#888780" x="612" y="222" text-anchor="middle">You review</text>

  <!-- Warning -->
  <rect x="110" y="354" width="440" height="22" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="11" fill="#993C1D" x="330" y="369" text-anchor="middle">The agent may take dozens of actions before surfacing a result.</text>
</svg>
