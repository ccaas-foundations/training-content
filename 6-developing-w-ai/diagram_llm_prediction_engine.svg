<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 310">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Input boxes -->
  <rect x="40" y="44" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441" x="105" y="71" text-anchor="middle">Your prompt</text>

  <rect x="40" y="100" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441" x="105" y="127" text-anchor="middle">Open file context</text>

  <rect x="40" y="156" width="130" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="#444441" x="105" y="183" text-anchor="middle">Nearby files</text>

  <text font-family="Arial, sans-serif" font-size="12" fill="#888780" x="105" y="220" text-anchor="middle">Inputs (tokens)</text>

  <!-- Arrows into model -->
  <line x1="170" y1="66" x2="238" y2="130" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="170" y1="122" x2="238" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="170" y1="178" x2="238" y2="152" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- LLM box -->
  <rect x="242" y="80" width="196" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#3C3489" x="340" y="132" text-anchor="middle">LLM</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#534AB7" x="340" y="152" text-anchor="middle">Matches patterns from</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#534AB7" x="340" y="167" text-anchor="middle">billions of code examples</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#888780" x="340" y="220" text-anchor="middle">Pattern matcher, not database</text>

  <!-- Arrow to output -->
  <line x1="438" y1="140" x2="490" y2="140" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- Output box -->
  <rect x="494" y="104" width="146" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041" x="567" y="135" text-anchor="middle">Most probable</text>
  <text font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#085041" x="567" y="153" text-anchor="middle">next tokens</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#888780" x="567" y="194" text-anchor="middle">Output</text>

  <!-- Warning callout -->
  <rect x="40" y="250" width="600" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#712B13" x="340" y="268" text-anchor="middle">Key implication: the model does not know if its output is correct.</text>
  <text font-family="Arial, sans-serif" font-size="12" fill="#993C1D" x="340" y="284" text-anchor="middle">It knows what code tends to look like. Plausible and correct are not the same thing.</text>
</svg>
